name: Probe playlists
on:
  push:
    branches: ['probe-*']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/probe2.mjs 2>&1 | tee data/probe.log
      - run: |
          git config user.name "slowtv-bot"
          git config user.email "slowtv-bot@users.noreply.github.com"
          git add data
          git commit -m "Probe result" || true
          git push
